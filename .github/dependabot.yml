# Weekly update PRs for Cargo dependencies and the GitHub Actions in ci.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # release.yml is generated by `dist generate`: a hand edit fails
    # `dist plan`. Its pins live in dist-workspace.toml
    # ([dist.github-action-commits]); update them there and regenerate.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions:
        patterns: ["*"]
