[package]
name = "meiose"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order", "arbitrary_precision"] }
similar = "3.2.1"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tempfile = "3.27.0"

[[bench]]
name = "prune"
harness = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
