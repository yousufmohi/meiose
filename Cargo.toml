[package]
name = "meiose"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "An MCP proxy that trims oversized tool outputs before they reach your agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yousufmohi/meiose"
homepage = "https://github.com/yousufmohi/meiose"
readme = "README.md"
keywords = ["mcp", "llm", "agents", "playwright", "proxy"]
categories = ["command-line-utilities", "development-tools"]
# Tests ship ~6 MB of fixtures; the published crate needs only the source.
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order", "arbitrary_precision"] }
similar = "3.2.1"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tempfile = "3.27.0"

[[bench]]
name = "prune"
harness = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
